services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CLOCKIN_SQL_PORT:-14333}:1433"
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -d master -C -b -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - clockin-sqlserver-data:/var/opt/mssql

volumes:
  clockin-sqlserver-data:
